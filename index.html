<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Попкорн</title>
    <script>
      window.__errors = [];
      window.addEventListener('error', (e) => {
        window.__errors.push((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errors.push('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div id="title">Попкорн</div>
      <div id="hint">Вращай сцену мышью · кликни по зерну, чтобы оно лопнуло</div>
    </div>

    <div id="controls">
      <div id="counter"><span id="poppedCount">0</span> / <span id="totalCount">14</span></div>
      <button id="reset" type="button">Заново</button>
    </div>

    <div id="loading">загрузка…</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
